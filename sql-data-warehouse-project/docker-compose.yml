# Local SQL Server 2022 for running the warehouse (development only).
# Apple-silicon Macs: the amd64 image runs under emulation - enable
# "Use Rosetta for x86_64/amd64 emulation" in Docker Desktop for best results.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: dwh-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set a password}
    ports:
      - "1433:1433"
    volumes:
      - ./datasets:/var/opt/mssql/datasets:ro
      - ./scripts:/scripts:ro
      - ./tests:/tests:ro
